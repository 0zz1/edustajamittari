# railway.toml — Edustajamittari monorepo
# Three services: api, frontend, pipeline (cron)
# Deploy with: railway up

[project]
name = "edustajamittari"

# ── API service ──────────────────────────────────────────────────────────────
[[services]]
name = "api"
source = "api"

[services.build]
builder = "nixpacks"

[services.deploy]
startCommand = "gunicorn api:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[services.variables]
DATABASE_URL   = "${{Postgres.DATABASE_URL}}"
PYTHON_VERSION = "3.12"

# ── Frontend service ─────────────────────────────────────────────────────────
[[services]]
name = "frontend"
source = "frontend"

[services.build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[services.deploy]
startCommand = "npx serve dist --listen $PORT"
restartPolicyType = "on_failure"

[services.variables]
NODE_VERSION = "20"
VITE_API_URL = "${{api.RAILWAY_PUBLIC_DOMAIN}}"

# ── Pipeline cron service ────────────────────────────────────────────────────
[[services]]
name = "pipeline"
source = "pipeline"

[services.build]
builder = "nixpacks"

[services.deploy]
# Runs once on deploy, then weekly via cron
startCommand = "python pipeline.py --update"
cronSchedule = "0 3 * * 0"          # every Sunday 03:00 UTC
restartPolicyType = "never"

[services.variables]
DATABASE_URL   = "${{Postgres.DATABASE_URL}}"
PYTHON_VERSION = "3.12"
